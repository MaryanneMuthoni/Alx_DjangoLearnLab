{% load static %}
<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>List</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <h1>Blog post list</h1>
    
    <ul>
	{% for post in post_list %}
	<li>{{post.title}}: {{post.content}} posted on {{post.published_date}} by {{post.author.username}}</li>
	{% endfor %}
    </ul>
</body>
</html>
